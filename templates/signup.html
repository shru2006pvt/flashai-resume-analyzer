<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Resume AI Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}" />
  </head>
  <body>
    <header class="hero-header">
      <div class="brand">
        <h1>Resume AI Analyzer</h1>
        <p>Create an account to save candidate reports and access your recruiter dashboard.</p>
      </div>
      <nav>
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('login') }}">Login</a>
      </nav>
    </header>

    <main class="page-grid">
      <section class="panel auth-panel">
        <h2>Sign Up</h2>
        <form method="post" action="{{ url_for('signup') }}">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="yourname" required />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="********" required />

          <button type="submit" class="primary-btn">Sign Up</button>
        </form>
        <p class="auth-hint">
          Already registered? <a href="{{ url_for('login') }}">Login here</a>.
        </p>
      </section>
    </main>
  </body>
</html>
