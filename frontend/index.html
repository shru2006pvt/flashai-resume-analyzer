<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlashAI Login</title>
    <link rel="stylesheet" href="static/styles/style.css" />
</head>
<body>
    <header class="hero hero-login">
        <div class="hero-content">
            <div>
                <h1>FlashAI Resume Analyzer</h1>
                <p>Secure access to candidate matching, job overview, and resume analytics.</p>
            </div>
            <div class="hero-card">
                <h2>Sign in to continue</h2>
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" placeholder="admin@flashai.com" required />
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" placeholder="Enter your password" required />
                    </div>
                    <button type="submit" class="button button-primary">Login</button>
                    <p class="hint">Use <strong>admin@flashai.com</strong> / <strong>Password123</strong> or <strong>guest@flashai.com</strong> / <strong>guest</strong></p>
                </form>
                <div id="messageBox" class="message"></div>
            </div>
        </div>
    </header>
    <script src="static/scripts/login.js"></script>
</body>
</html>
